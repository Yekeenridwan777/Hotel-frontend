<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lounge Booking | Minista of Enjoyment Lounge & Suites</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        url("https://images.unsplash.com/photo-1566073771259-6a8506099945") center/cover no-repeat;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lounge-container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 600px;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      animation: fadeIn 1.2s ease;
    }

    .lounge-container h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #ffd700;
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      letter-spacing: 1px;
      animation: slideDown 1s ease;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    form input,
    form select,
    form textarea {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.3s ease;
    }

    form input::placeholder,
    form textarea::placeholder {
      color: #ccc;
    }

    form input:focus,
    form select:focus,
    form textarea:focus {
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255,215,0,0.4);
    }

    form label {
      font-weight: 600;
      margin-top: 10px;
      color: #ffd700;
      font-size: 0.95rem;
    }

    button {
      background: #ffd700;
      color: #000;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin-top: 15px;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #c9a200;
      transform: scale(1.03);
    }

    .msg {
      margin-top: 12px;
      text-align: center;
      font-weight: 500;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 600px) {
      .lounge-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="lounge-container">
    <h1>Book a Lounge Table or Party</h1>

    <form id="loungeForm">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />
      <input type="tel" id="phone" placeholder="Your Phone Number" required />

      <label for="tableType">Choose Booking Type:</label>
      <select id="tableType" required>
        <option value="">-- Select Type --</option>
        <option value="Table for 2">Table for 2</option>
        <option value="Table for 4">Table for 4</option>
        <option value="Birthday Party">Birthday Party</option>
        <option value="Corporate Event">Corporate Event</option>
        <option value="Other Party">Other Party</option>
      </select>

      <label for="LoungeGuests">Number of Guests</label>
      <input type="number" id="LoungeGuests" name="guests" placeholder="Enter number of guests" required />

      <label for="date">Date:</label>
      <input type="date" id="date" required />

      <label for="time">Time:</label>
      <input type="time" id="time" required />

      <textarea id="message" rows="4" placeholder="Additional Requests (optional)"></textarea>

      <button type="submit">Submit Booking</button>
      <p class="msg" id="msg"></p>
    </form>
  </div>

  <script>
    document.getElementById("loungeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "⏳ Sending your request...";
      msg.style.color = "white";

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        tableType: document.getElementById("tableType").value,
        LoungeGuest: document.getElementById("LoungeGuests").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        message: document.getElementById("message").value,
      };

      try {
        const res = await fetch("https://hotel-booking-oujg.onrender.com/lounge", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const result = await res.json();

        if (result.success) {
          msg.textContent = "✅ Lounge booking request sent successfully!";
          msg.style.color = "#00ff6a";
          e.target.reset();
        } else {
          msg.textContent = "❌ Could not send booking request.";
          msg.style.color = "#ff4444";
        }
      } catch (error) {
        msg.textContent = "⚠ Server error. Try again later.";
        msg.style.color = "#ff4444";
      }
    });
  </script>
</body>
</html>
