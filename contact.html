<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Minista of Enjoyment Hotel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: #f9f9f9;
      color: #333;
      overflow-x: hidden;
    }

    /* 🌟 Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgb(97, 45, 2);
      padding: 15px 35px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    }
    nav .logo {
      font-size: 24px;
      font-weight: 700;
      color: white;
      letter-spacing: 1px;
    }
    nav ul {
      display: flex;
      list-style: none;
      gap: 25px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }
    nav ul li a:hover {
      color: gold;
    }

    /* ✨ Header */
    header {
      text-align: center;
      padding: 60px 20px 40px;
      background: linear-gradient(to bottom, rgb(97,45,2), #f9f9f9);
      color: white;
      animation: fadeIn 1s ease;
    }
    header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    header p {
      font-size: 16px;
      color: #f1f1f1;
    }

    /* 💬 Contact Section */
    .contact-container {
      max-width: 650px;
      background: white;
      margin: 40px auto;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      animation: slideUp 0.9s ease;
    }

    .contact-container h2 {
      text-align: center;
      color: rgb(97,45,2);
      margin-bottom: 25px;
      font-size: 24px;
    }

    form input,
    form textarea {
      width: 100%;
      padding: 12px 15px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s;
    }
    form input:focus,
    form textarea:focus {
      border-color: rgb(97,45,2);
      box-shadow: 0 0 6px rgba(97,45,2,0.3);
      outline: none;
    }

    form textarea {
      min-height: 130px;
      resize: vertical;
    }

    form button {
      width: 100%;
      padding: 13px;
      background: rgb(97,45,2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    form button:hover {
      background: rgb(250,94,3);
      transform: scale(1.03);
    }

    .message {
      text-align: center;
      margin-top: 12px;
      font-size: 15px;
      font-weight: 500;
    }

    /* 📍 Map Section */
    #map {
      padding: 60px 20px;
      background: #fafafa;
      text-align: center;
      animation: fadeIn 1s ease;
    }
    #map h2 {
      color: rgb(97,45,2);
      margin-bottom: 10px;
    }
    #map p {
      color: #555;
      margin-bottom: 20px;
    }
    iframe {
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      height: 350px;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* 🦶 Footer */
    footer {
      background: rgb(97,45,2);
      color: white;
      text-align: center;
      padding: 25px 10px;
      margin-top: 50px;
    }
    footer a {
      color: gold;
      text-decoration: none;
      font-weight: 500;
    }

    /* 📱 Responsive */
    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }
      .contact-container {
        margin: 20px;
        padding: 25px;
      }
    }

    /* ✨ Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">Minista of Enjoyment Hotel</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="rooms.html">Rooms</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header>
    <h1>Contact Us</h1>
    <p>We’d love to hear from you — reach out with any questions or bookings.</p>
  </header>

  <div class="contact-container">
    <h2>Send Us a Message</h2>
    <form id="contactForm">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <textarea id="message" placeholder="Write your message here..." required></textarea>
      <button type="submit">Send Message</button>
    </form>
    <div class="message" id="contactMsg"></div>
  </div>

  <section id="map">
    <h2>Find Us</h2>
    <p>Minista of Enjoyment Hotel, Lagos</p>
    <iframe
      loading="lazy"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"
      src="https://www.google.com/maps/embed/v1/place?key=AIzaSyBOmrjjad6MXoaW0vmNSpeczryOC0-06xQ&q=6.435273,3.958268">
    </iframe>
  </section>

  <footer>
    <p>&copy; 2025 Minista of Enjoyment Hotel. All rights reserved.</p>
    <p>Follow us on <a href="#">Instagram</a> | <a href="#">Facebook</a></p>
  </footer>

  <script>
    const form = document.getElementById("contactForm");
    const msg = document.getElementById("contactMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "⏳ Sending...";
      msg.style.color = "black";

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value,
      };

      try {
        const res = await fetch("https://hotel-booking-oujg.onrender.com/contact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const result = await res.json();

        if (result.success) {
          msg.textContent = "✅ Message sent successfully!";
          msg.style.color = "green";
          form.reset();
        } else {
          msg.textContent = "❌ Failed to send message.";
          msg.style.color = "red";
        }
      } catch (error) {
        msg.textContent = "⚠ Server error. Try again later.";
        msg.style.color = "red";
      }
    });
  </script>
</body>
</html>
